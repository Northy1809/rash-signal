name: rash-signal tick

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rash-signal-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 55 ticks (60s apart)
        run: python -u paper_bot.py --tick 55 60

      - name: Commit state
        run: |
          git config user.name "rash-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_state.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "tick $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase --autostash origin master
            git push
          fi
